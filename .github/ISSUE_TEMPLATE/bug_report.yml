name: Bug Report
description: Report a reproducible defect.
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: OS, architecture, toolchain, feature flags, and relevant configuration.
    validations:
      required: true
